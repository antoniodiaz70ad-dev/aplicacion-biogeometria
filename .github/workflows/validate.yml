name: Validar aplicación

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Comprobar catálogo, dibujos y fuentes
        run: python3 scripts/check_assets.py
      - name: Compilar y comprobar tipos
        run: npm run build
